[package]
name = "portfolio-world-server"
version = "0.1.0"
edition = "2021"
description = "Authoritative multiplayer + admin-tooling server for Portfolio World. See docs/adr-004."

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
