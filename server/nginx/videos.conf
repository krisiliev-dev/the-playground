# nginx snippet for serving the converted 360° videos.
#
# Drop this inside the main `server { ... }` block for krisiliev.dev on EC2
# (e.g. /etc/nginx/sites-available/playground) then `nginx -t && systemctl reload nginx`.
#
# Assumes Docker mounts /home/ubuntu/videos → /home/appuser/videos.
# Nginx serves them directly from the host path (no container round-trip).

location /videos/ {
    alias /home/ubuntu/videos/;
    autoindex off;

    # CORS — client runs on localhost in dev, Vercel in prod
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Cache-Control "public, max-age=604800, immutable" always;

    # Respond to CORS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Byte-range requests so <video> can seek
    add_header Accept-Ranges bytes;

    # Don't expose the jobs file to the public
    location = /videos/jobs.json {
        return 404;
    }

    # Explicit MIME types
    types {
        video/mp4  mp4;
        image/jpeg jpg jpeg;
        image/png  png;
    }
    default_type application/octet-stream;
}
