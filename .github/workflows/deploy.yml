# CD Pipeline — deploys to production (main branch).
#
# Deployment targets:
# - Client: Vercel (automatic, no config needed here)
# - Server: SSH into EC2, pull, rebuild Docker, restart

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-server:
    name: "Deploy Server"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VIDEOS_PUBLIC_PREFIX: ${{ secrets.VIDEOS_PUBLIC_PREFIX }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ADMIN_TOKEN,VIDEOS_PUBLIC_PREFIX
          # Cold Rust compile on the EC2 box exceeds the default 10m
          # window; warm subsequent builds finish in seconds because the
          # Dockerfile pre-fetches deps via a stub main.rs.
          command_timeout: 30m
          script: |
            cd ~/the-playground
            git pull origin main
            cd server
            docker build -t playground-server .
            docker stop playground-server || true
            docker rm playground-server || true
            mkdir -p /home/ubuntu/videos
            docker run -d \
              --name playground-server \
              -p 8080:8080 \
              --restart unless-stopped \
              -v /home/ubuntu/videos:/home/appuser/videos \
              -e ADMIN_TOKEN="$ADMIN_TOKEN" \
              -e VIDEOS_PUBLIC_PREFIX="$VIDEOS_PUBLIC_PREFIX" \
              playground-server
            docker image prune -f
