# CD Pipeline — deploys to production (main branch).
#
# Deployment targets:
# - Client: Vercel (automatic, no config needed here)
# - Server: SSH into EC2, pull, rebuild Docker, restart

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-server:
    name: "Deploy Server"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/the-playground
            git pull origin main
            cd server
            docker build -t playground-server .
            docker stop playground-server || true
            docker rm playground-server || true
            docker run -d --name playground-server -p 8080:8080 --restart unless-stopped playground-server
            docker image prune -f