# CD Pipeline — deploys to demo (develop branch) and production (main branch).
#
# Deployment targets:
# - Client: Vercel (krisiliev.dev)
# - Server: AWS ECR → ECS Fargate (api.krisiliev.dev)
#
# Required GitHub Secrets (set in repo Settings → Secrets):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   AWS_ECR_REPOSITORY (e.g., portfolio-world-server)
#   AWS_ECS_CLUSTER_PROD, AWS_ECS_SERVICE_PROD
#   AWS_ECS_CLUSTER_DEMO, AWS_ECS_SERVICE_DEMO

name: Deploy

on:
  push:
    branches: [main, develop]

# Only run one deploy at a time per branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Determine environment ─────────────────────────────────────────

  setup:
    name: "Determine environment"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      is_production: ${{ steps.env.outputs.is_production }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=demo" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy Client to Vercel ───────────────────────────────────────

  deploy-client:
    name: "Deploy Client (${{ needs.setup.outputs.environment }})"
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── Vercel deployment ───────────────────────────────────────
      # Uncomment once you've run `vercel link` and added secrets.
