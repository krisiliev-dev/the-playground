      #     working-directory: ./client
      #     vercel-args: ${{ needs.setup.outputs.is_production == 'true' && '--prod' || '' }}

      - name: "Placeholder: deploy step"
        run: echo "Client build ready for ${{ needs.setup.outputs.environment }}"

  # ── Deploy Server to AWS ──────────────────────────────────────────

  deploy-server:
    name: "Deploy Server (${{ needs.setup.outputs.environment }})"
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

