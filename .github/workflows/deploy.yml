# CD Pipeline — deploys to production (main branch).
#
# Deployment targets:
# - Client: Vercel (automatic, no config needed here)
# - Server: build the Docker image on the GitHub-hosted runner, ship it
#   to EC2 over SSH as a tarball, `docker load` and run it there.
#
# Why we don't build on EC2: the small EC2 instance can't compile this
# Rust dep set inside the SSH command_timeout — 30+ minutes wasn't
# enough on the cold path. The hosted runner (16 GB / 4 cores) plus
# Buildx layer cache (cache-from/cache-to: type=gha) gets cold builds
# under 5 min and warm builds under 1 min.

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-server:
    name: "Build & Deploy Server"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image with GHA layer cache
        uses: docker/build-push-action@v5
        with:
          context: ./server
          load: true
          tags: playground-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Export image to tarball
        run: docker save playground-server:latest -o playground-server.tar

      - name: Copy image tarball to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: playground-server.tar
          target: /tmp/
          # scp-action wraps in tar+gzip before send; on the EC2 disk
          # both the upload + remote untar of a ~230 MB image take ~9
          # min combined. 20m gives a safety buffer.
          command_timeout: 20m

      - name: Load image and (re)start container on EC2
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VIDEOS_PUBLIC_PREFIX: ${{ secrets.VIDEOS_PUBLIC_PREFIX }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ADMIN_TOKEN,VIDEOS_PUBLIC_PREFIX
          # `docker load` of a 230 MB tarball on the EC2 box can exceed
          # 5 min on slow EBS — bump to 15m. Subsequent deploys without
          # layer changes finish in seconds (docker dedups by hash).
          command_timeout: 15m
          script: |
            docker load -i /tmp/playground-server.tar
            rm /tmp/playground-server.tar
            docker stop playground-server || true
            docker rm playground-server || true
            mkdir -p /home/ubuntu/videos
            docker run -d \
              --name playground-server \
              -p 8080:8080 \
              --restart unless-stopped \
              -v /home/ubuntu/videos:/home/appuser/videos \
              -e ADMIN_TOKEN="$ADMIN_TOKEN" \
              -e VIDEOS_PUBLIC_PREFIX="$VIDEOS_PUBLIC_PREFIX" \
              playground-server:latest
            docker image prune -f
